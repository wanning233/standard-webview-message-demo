<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PG-01 页面 B</title>
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#202124; }
    body { margin:0; padding:24px 16px; background:#f6f7f9; }
    .card { padding:20px 16px; border-radius:14px; background:#fff; }
    h1 { margin:0 0 8px; font-size:22px; }
    p { color:#60646c; font-size:14px; line-height:1.6; }
    button { width:100%; min-height:48px; border:0; border-radius:10px; padding:10px 12px; background:#1677ff; color:#fff; font-size:16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PG-01 页面 B</h1>
    <p>容器 A 目前处于隐藏状态。点击返回 A 后，检查 A 的滚动位置、输入值、计数器和 load_id。</p>
    <button id="back" type="button">返回页面 A</button>
  </div>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
  <script>
    document.getElementById('back').addEventListener('click', function () {
      if (!window.wx || !wx.miniProgram || typeof wx.miniProgram.navigateBack !== 'function') {
        alert('未检测到微信小程序桥接，请使用左上角返回。');
        return;
      }
      wx.miniProgram.navigateBack({ delta: 1 });
    });
  </script>
</body>
</html>
