<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H</title>
  <style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;line-height:1.6}code{word-break:break-all}</style>
</head>
<body>
  <h1>默认分享标题测试</h1>
  <p>本页面将 document.title 固定为“<code>H</code>”，不会发送分享消息，也不会延迟修改标题。</p>
  <p>预期：容器导航栏先显示启动参数中的 <code>T</code>，加载完成后变为 <code>H</code>；默认分享卡片标题取 <code>H</code>。</p>
  <p id="state"></p>
  <script>
    document.title = 'H';
    document.getElementById('state').textContent = '当前 document.title：' + document.title;
  </script>
</body>
</html>
